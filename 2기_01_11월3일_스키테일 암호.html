<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>스키테일 암호 · 수업 슬라이드</title><style>
*{box-sizing:border-box}body{margin:0;background:#e7e9e6;color:#172e31;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif}#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center;background:#faf9f4;box-shadow:0 16px 80px #122b3420;padding:48px 68px 80px;overflow:hidden}header{font-size:17px;color:#447779;letter-spacing:2px;font-weight:700}h1{font-size:46px;letter-spacing:-2px;margin:15px 0 28px;line-height:1.2}p{font-size:28px;line-height:1.65;margin:17px 0}.hero{font-size:46px;font-weight:700;line-height:1.5;margin:44px 0}.sub{font-size:19px;color:#587074;line-height:1.6}.route{font-size:22px;border-top:2px solid #b3cfca;padding-top:24px;margin-top:38px}b{color:#00766b}.prompt{font-size:30px;border-left:5px solid #dca142;padding-left:22px;margin-top:26px}dl{display:grid;grid-template-columns:150px 1fr;gap:26px;font-size:30px;margin:45px 0}dt{color:#00766b;font-weight:bold}dd{margin:0}blockquote{font-size:28px;line-height:1.7;margin:0;padding:25px 30px;background:#eaf1eb;border-left:5px solid #008375}ol{font-size:27px;line-height:1.85;padding-left:38px;margin:15px 0}.formula{font-size:36px;margin:38px 0}.cells{display:grid;gap:6px;margin:30px 0}.cell{height:85px;text-align:center;padding:8px;font-size:37px;font-weight:bold;border:1px solid #bec9c4;border-radius:4px}.cell small{display:block;font-size:15px;font-weight:normal;margin-bottom:4px}.c0{background:#f9d4cf}.c1{background:#d7e8fa}.c2{background:#dcebcf}.c3{background:#f8e8a8}.answer{margin-top:20px;background:#e3f0e7;padding:20px 25px;font-size:28px;line-height:1.55;border-left:5px solid #00766b}.split{display:grid;grid-template-columns:1fr 1fr;gap:45px;align-items:center}.split p{font-size:25px}.grid{display:grid;gap:4px;width:max-content;margin:auto}.gcell{background:#e9eeea;border:1px solid #bccdc7;display:flex;align-items:center;justify-content:center;font-size:29px;height:46px;min-width:56px;font-weight:700}.gcell.hot{background:#ffdc85;color:#513e12}.ghead{font-size:15px;background:transparent;border:0}.cipher{font-size:27px;letter-spacing:3px;line-height:1.8;overflow-wrap:anywhere;color:#00766b;margin:18px 0;font-weight:bold}.inputrow{display:flex;gap:12px;align-items:center;margin-bottom:20px;font-size:22px}input,select{font:22px 'Malgun Gothic',sans-serif;padding:10px;border:1px solid #9cafaa;border-radius:5px}input{width:660px}button{font:17px 'Malgun Gothic',sans-serif;padding:10px 15px;border:1px solid #99b2ac;border-radius:5px;background:#fff;color:#1c4744;cursor:pointer}button:hover{background:#e0efea}button:focus-visible{outline:3px solid #db992e}button:disabled{opacity:.35;cursor:default}.sequence{font-size:70px;letter-spacing:8px;margin:65px 0}.sequence span{color:#c69030}.blank{border-bottom:3px solid #ca973c}footer{position:absolute;bottom:20px;left:68px;right:68px;display:flex;align-items:center;gap:10px;border-top:1px solid #d5dcd5;padding-top:13px;font-size:16px}#count{margin-left:auto}#progress{position:absolute;bottom:0;left:0;height:5px;background:#0d8277;transition:width .2s}#note{position:absolute;bottom:85px;left:68px;right:68px;background:#193b3b;color:white;padding:20px;font-size:20px;line-height:1.65;z-index:5;box-shadow:0 5px 20px #0003}#timerPanel{position:absolute;right:68px;top:44px;display:flex;gap:7px;align-items:center;font-size:18px}#minutes{width:65px;font-size:16px;padding:6px}#clock{font-variant-numeric:tabular-nums;font-size:22px;min-width:64px}#timerPanel button{padding:6px 10px;font-size:14px}#menu{position:absolute;inset:25px;background:#faf9f4;z-index:10;overflow:auto;padding:30px;box-shadow:0 0 0 100px #17373755}#menu button{display:block;width:100%;text-align:left;margin:7px 0}#toast{position:absolute;top:10px;left:40%;background:#193b3b;color:white;padding:10px;z-index:20} [hidden]{display:none!important}@media print{body{background:white}#stage{position:static;transform:none!important;box-shadow:none}footer,#timerPanel{display:none}}
</style></head><body><main id="stage"><header id="tag"></header><h1 id="title"></h1><article id="body"></article><div id="timerPanel"><input id="minutes" type="number" min="1" max="120" value="10" aria-label="타이머 분"><span id="clock">10:00</span><button id="start">시작</button><button id="resetTimer">초기화</button></div><aside id="note" hidden></aside><nav id="menu" hidden></nav><div id="toast" hidden></div><footer><button id="prev">← 이전</button><button id="next">다음 →</button><button id="reveal">정답 보기</button><button id="notes">교사 메모</button><button id="contents">목차</button><button id="full">전체화면</button><span id="count"></span></footer><div id="progress"></div></main><script>
const slides=[{"tag":"암호와 수 · 11월 3일","title":"스키테일 암호","body":"<p class=\"hero\">글자의 자리를 바꾸면<br>어떤 수의 규칙이 나타날까요?</p><p class=\"sub\">원화중학교 1학년 · 자유학기 주제선택</p>","note":"활동지를 준비합니다. 방향키로 이동하고 정답 보기 버튼으로 답을 공개합니다.","time":0},{"tag":"오늘의 탐구","title":"막대에 감았다 풀었을 뿐인데","body":"<p class=\"hero\">왜 글자가 뒤섞일까요?</p><p>같은 면에 쓴 글자의 위치를 찾아<br><b>배수와 약수</b>로 설명해 봅시다.</p><div class=\"route\">역사 탐험 10분 → 규칙 탐구 15분 → 제작·해독 25분 → 성찰 10분</div>","note":"활동지에 적힌 네 활동의 합은 60분입니다. 학교 수업 시간에 맞게 타이머를 조정할 수 있습니다.","time":0},{"tag":"준비","title":"암호를 설명하는 세 가지 말","body":"<dl><dt>암호화</dt><dd>원래 글을 알아보기 어렵게 바꾸기</dd><dt>복호화</dt><dd>암호문을 원래 글로 되돌리기</dd><dt>열쇠</dt><dd>암호를 풀기 위해 알아야 하는 약속</dd></dl><p class=\"prompt\">우리끼리만 글을 읽으려면 어떤 약속이 필요할까요?</p>","note":"","time":0},{"tag":"활동 1 · 활동지 위쪽","title":"AI와 함께하는 역사 탐험","body":"<blockquote>사람들은 왜 암호를 만들었을까?<br>고대 스파르타의 스키테일 암호는 언제, 어디서, 어떻게 쓰였는지 중학생 눈높이로 3문장으로 알려 줘.</blockquote><p>활동지에 <b>암호가 필요했던 이유</b>와<br><b>언제·어디서·누가</b>를 정리하세요.</p>","note":"역사 조사와 다음 슬라이드의 검토를 합쳐 10분입니다. 특정 연도를 교사 정답으로 단정하지 않고 학생들이 근거를 확인하도록 합니다.","time":10},{"tag":"활동 1 · 확인","title":"AI의 답은 어떻게 확인할까요?","body":"<p class=\"hero\">“근거는 무엇이야?”</p><p>자료의 제목과 출처를 요청하고, 실제 자료와 맞는지 확인하세요.</p><p>짝과 답을 비교한 뒤 O / X를 표시하세요.</p><div class=\"answer\" hidden>답이 같아도 사실이라는 보장은 없습니다.<br>서로 다른 답이 있다면 출처와 설명을 다시 확인합니다.</div>","note":"AI가 제시한 출처 자체가 실제로 존재하는지도 확인하도록 안내합니다.","time":0},{"tag":"활동 2 · 4개 면, 3바퀴","title":"풀어진 띠의 암호문","body":"<div class=\"cells\" style=\"grid-template-columns:repeat(12,1fr)\"><div class=\"cell c0\"><small>1</small>A</div><div class=\"cell c1\"><small>2</small>A</div><div class=\"cell c2\"><small>3</small>A</div><div class=\"cell c3\"><small>4</small>A</div><div class=\"cell c0\"><small>5</small>T</div><div class=\"cell c1\"><small>6</small>C</div><div class=\"cell c2\"><small>7</small>T</div><div class=\"cell c3\"><small>8</small>W</div><div class=\"cell c0\"><small>9</small>T</div><div class=\"cell c1\"><small>10</small>K</div><div class=\"cell c2\"><small>11</small>D</div><div class=\"cell c3\"><small>12</small>N</div></div><p class=\"prompt\">같은 색은 같은 면입니다.<br>빨간색 글자는 몇 번째 칸에 있나요?</p><div class=\"answer\" hidden><b>1, 5, 9번째</b> · 글자는 A, T, T입니다.<br>다음 글자까지 4칸씩 이동합니다.</div>","note":"활동지의 암호문 AAAATCTWTKDN을 그대로 사용했습니다. 활동 2 전체 15분입니다.","time":15},{"tag":"활동 2 · 배수 규칙","title":"네 번째 면의 칸 번호","body":"<div class=\"cells\" style=\"grid-template-columns:repeat(12,1fr)\"><div class=\"cell c0\"><small>1</small>A</div><div class=\"cell c1\"><small>2</small>A</div><div class=\"cell c2\"><small>3</small>A</div><div class=\"cell c3\"><small>4</small>A</div><div class=\"cell c0\"><small>5</small>T</div><div class=\"cell c1\"><small>6</small>C</div><div class=\"cell c2\"><small>7</small>T</div><div class=\"cell c3\"><small>8</small>W</div><div class=\"cell c0\"><small>9</small>T</div><div class=\"cell c1\"><small>10</small>K</div><div class=\"cell c2\"><small>11</small>D</div><div class=\"cell c3\"><small>12</small>N</div></div><p class=\"prompt\">노란색 칸의 번호에는 어떤 공통점이 있나요?</p><div class=\"answer\" hidden><b>4, 8, 12</b>는 모두 <b>4의 배수</b>입니다.<br>다른 면도 4칸 간격이지만, 칸 번호가 모두 4의 배수인 것은 아닙니다.</div>","note":"","time":0},{"tag":"활동 2 · 해독 시연","title":"세로로 채우고, 가로로 읽기","body":"<div class=\"split\"><div id=\"demo4\"></div><div><p>암호문을 한 열에<br><b>위에서 아래로</b> 채웁니다.</p><button onclick=\"step4()\">한 바퀴 채우기</button> <button onclick=\"reset4()\">처음부터</button><p class=\"sub\">세 열을 채운 뒤 면1부터 가로로 읽으세요.</p></div></div><div class=\"answer\" hidden><b>ATT / ACK / ATD / AWN</b><br>ATTACK AT DAWN · 새벽에 공격하라</div>","note":"4행×3열입니다. 열은 바퀴, 행은 면을 뜻합니다. 정답은 학생의 추론 후 공개합니다.","time":0},{"tag":"활동 2 · 규칙 정리","title":"면 수가 n개라면","body":"<p class=\"formula\">같은 면의 글자 사이 간격 = <b>n칸</b></p><p class=\"formula\">전체 칸 수 = <b>면 수 × 바퀴 수</b></p><p class=\"prompt\">전체 칸을 채웠다면 글자 수는 어떤 수의 배수일까요?</p><div class=\"answer\" hidden>전체 글자 수는 <b>n의 배수</b>입니다.<br>원래 메시지가 짧으면 남은 칸을 X로 채워 완성합니다.</div>","note":"“항상 배수”는 온전한 바퀴 수의 격자를 모두 채웠을 때의 설명입니다. 원래 메시지의 글자 수 자체는 n의 배수가 아닐 수 있습니다.","time":0},{"tag":"활동 3 · 제작 준비","title":"6개 면 × 4바퀴 = 24칸","body":"<p class=\"hero\">메시지 → 가로로 쓰기 → 세로로 읽기</p><ol><li>24글자 이내의 짧은 메시지를 정합니다.</li><li>면1부터 한 줄씩, 한 칸에 한 글자를 씁니다.</li><li>남는 칸은 X로 채웁니다.</li><li>1바퀴부터 세로로 읽어 암호문을 적습니다.</li></ol><p class=\"sub\">띄어쓰기는 빼고, 한글은 한 음절을 한 칸에 씁니다.</p>","note":"한글·영문 모두 가능합니다. 띄어쓰기를 빼는 것은 슬라이드에서 제안하는 공통 약속입니다. X가 원문에 들어간다면 채움 문자 구분 방법을 미리 정하세요.","time":25},{"tag":"활동 3 · 함께 시연","title":"우리의 암호 제작기","body":"<div class=\"inputrow\"><input id=\"message\" value=\"수학으로암호의비밀을함께찾아보자\" maxlength=\"48\" aria-label=\"암호화할 메시지\"><button onclick=\"makeCipher()\">격자에 쓰기</button></div><div class=\"split\"><div id=\"grid6\"></div><div><p id=\"lengthInfo\" class=\"sub\"></p><button onclick=\"readCol()\">한 열씩 읽기</button> <button onclick=\"showCipher()\">암호문 전체 보기</button><div id=\"cipherOut\" class=\"cipher\"></div></div></div>","note":"입력은 공백을 제거한 뒤 24글자 이내만 허용합니다. 화면의 색 강조는 방금 읽은 열입니다.","time":0},{"tag":"활동 3 · 짝 활동","title":"암호문만 교환하기","body":"<ol><li>원래 메시지와 작성한 격자는 가립니다.</li><li>짝에게 암호문과 <b>면 수 6</b>을 알려 줍니다.</li><li>받은 24글자를 세로로 6개씩 채웁니다.</li><li>가로로 읽고, 끝의 채움 문자 X를 구분합니다.</li><li>원래 메시지와 비교하고 O / X를 표시합니다.</li></ol><p class=\"prompt\">틀렸다면 채운 방향과 빠뜨린 글자를 먼저 확인하세요.</p>","note":"활동지의 글자 수 칸에는 X를 포함한 완성 암호문 24개를 기준으로 쓰도록 안내하면 배수 확인과 연결됩니다. 원문 길이와 구분하세요.","time":0},{"tag":"활동 3 · 배수 규칙 확인","title":"면1의 글자 위치","body":"<p class=\"sequence\">1 → 7 → <span>?</span> → <span>?</span></p><p class=\"prompt\">면이 6개일 때, 같은 면의 다음 글자는 어디에 있을까요?</p><div class=\"answer\" hidden><b>13번째, 19번째</b><br>한 바퀴를 지날 때마다 칸 번호에 6을 더합니다.</div>","note":"","time":0},{"tag":"활동 3 · 막대가 없다면","title":"12글자의 암호문을 풀려면","body":"<p>전체 칸을 채운 직사각형 격자라고 가정해 봅시다.</p><p class=\"prompt\">면 수 × 바퀴 수 = 12<br>면 수의 후보에는 어떤 수가 있을까요?</p><div class=\"answer\" hidden><b>1, 2, 3, 4, 6, 12</b><br>이 수들은 12의 <b>약수</b>입니다.<br><span class=\"sub\">1행·12행도 격자 후보에 포함합니다. 실제 다각기둥의 면 수와는 구별합니다.</span></div>","note":"실물 다각기둥은 옆면 수가 3개 이상입니다. 여기서는 해독을 위한 격자의 행 수 후보를 묻는 것으로 명확히 합니다.","time":0},{"tag":"활동 3 · 해독 실험","title":"면 수를 바꾸면 무엇이 보일까요?","body":"<div class=\"inputrow\"><span>면 수 후보</span><select id=\"rows\" onchange=\"tryRows()\" aria-label=\"면 수 후보\"><option>1</option><option>2</option><option>3</option><option selected>4</option><option>6</option><option>12</option></select></div><div class=\"split\"><div id=\"trialGrid\"></div><div><p class=\"sub\">같은 암호문을 세로로 채운 뒤 가로로 읽습니다.</p><div id=\"trialText\" class=\"cipher\"></div><p>뜻이 통하는 문장이 나오는지 비교해 보세요.</p></div></div>","note":"원래 예제 암호문으로 약수 후보를 시험합니다. 4행일 때 ATTACKATDAWN이 됩니다. 12행은 화면에 맞게 작은 격자로 표시됩니다.","time":0},{"tag":"활동 4 · 성찰","title":"스키테일 암호의 약점","body":"<p class=\"prompt\">면 수를 모르는 사람도<br>어떻게 암호를 풀 수 있을까요?</p><div class=\"answer\" hidden>글자 수의 <b>약수</b>를 면 수 후보로 삼아<br>차례로 배열해 볼 수 있습니다.<br>글자의 종류와 개수가 그대로 남는 것도 단서가 됩니다.</div><p class=\"sub\">현대 보안과 연결하기: 방법을 알아도 열쇠를 찾기 어렵게 하려면 무엇이 달라져야 할까요?</p>","note":"성찰과 다음 정리를 합쳐 10분입니다. 이 수업의 단순한 격자 모형과 현대 암호를 동일한 방식으로 설명하지 않도록 합니다.","time":10},{"tag":"활동 4 · 오늘의 성찰 일지","title":"수학으로 설명하는 암호","body":"<p class=\"hero\">“스키테일 암호에는<br><span class=\"blank\">　　　　　</span>이/가 숨어 있다.”</p><p>단어를 채운 뒤, 오늘 찾은 칸 번호를 근거로 설명하세요.</p><div class=\"answer\" hidden>예시: 스키테일 암호에는 <b>배수와 약수</b>가 숨어 있다.<br>같은 면의 글자는 면 수만큼 떨어져 있고,<br>전체 글자 수의 약수로 면 수를 추측할 수 있다.</div>","note":"학생마다 자기 말로 설명하도록 합니다. 활동지 원본: https://drive.google.com/file/d/1zAkkxsvebBdhxiHotAGniklWmYquNMRQ/view","time":0}];
let idx=0,filled4=0,col6=0,plain6='',remaining=600,timer=null;
const $=id=>document.getElementById(id);
function resize(){ $('stage').style.transform='translate(-50%,-50%) scale('+Math.min(innerWidth/1300,innerHeight/740)+')';}addEventListener('resize',resize);resize();
function render(){let s=slides[idx];$('tag').textContent=s.tag;$('title').textContent=s.title;$('body').innerHTML=s.body;$('note').textContent=s.note||'학생이 설명할 시간을 준 뒤 다음 화면으로 이동하세요.';$('note').hidden=true;$('count').textContent=(idx+1)+' / '+slides.length;$('prev').disabled=idx===0;$('next').disabled=idx===slides.length-1;$('reveal').disabled=!document.querySelector('.answer');$('reveal').textContent='정답 보기';$('progress').style.width=((idx+1)/slides.length*100)+'%';if($('demo4'))reset4();if($('grid6'))makeCipher();if($('trialGrid'))tryRows();if(s.time&&!timer){$('minutes').value=s.time;resetTimer();}location.hash=idx+1;}
function move(n){idx=Math.max(0,Math.min(slides.length-1,idx+n));render();}
function reveal(){let a=document.querySelector('.answer');if(a){a.hidden=!a.hidden;$('reveal').textContent=a.hidden?'정답 보기':'정답 숨기기';}}
function grid(str,rows,cols,hot=-1,visible=cols,compact=false){let out='<div class="grid" style="grid-template-columns:55px repeat('+cols+',56px)"><div class="gcell ghead">면/바퀴</div>';for(let c=0;c<cols;c++)out+='<div class="gcell ghead">'+(c+1)+'</div>';for(let r=0;r<rows;r++){out+='<div class="gcell ghead" style="height:'+(compact?25:46)+'px">면'+(r+1)+'</div>';for(let c=0;c<cols;c++)out+='<div class="gcell '+(c===hot?'hot':'')+'" style="height:'+(compact?25:46)+'px;font-size:'+(compact?19:29)+'px">'+(c<visible?escapeHTML(str[r*cols+c]||''):'')+'</div>';}return out+'</div>';}
function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function decode(str,rows){let cols=str.length/rows,out='';for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)out+=str[c*rows+r];return out;}
function reset4(){filled4=0;$('demo4').innerHTML=grid('ATTACKATDAWN',4,3,-1,0);}function step4(){filled4=Math.min(3,filled4+1);$('demo4').innerHTML=grid('ATTACKATDAWN',4,3,filled4-1,filled4);}
function makeCipher(){let raw=[...$('message').value.replace(/\s/g,'')];if(raw.length>24){$('lengthInfo').textContent='24글자 이내로 입력해 주세요.';return;}if(!raw.length){$('lengthInfo').textContent='메시지를 입력해 주세요.';return;}plain6=raw.join('').padEnd(24,'X');col6=0;$('grid6').innerHTML=grid(plain6,6,4);$('lengthInfo').textContent='원문 '+raw.length+'글자 + 채움 X '+(24-raw.length)+'개 = 24칸';$('cipherOut').textContent='';}
function readCol(){col6=Math.min(4,col6+1);$('grid6').innerHTML=grid(plain6,6,4,col6-1);let out=[];for(let c=0;c<col6;c++){let part='';for(let r=0;r<6;r++)part+=plain6[r*4+c];out.push(part);}$('cipherOut').textContent=out.join(' / ');}function showCipher(){col6=3;readCol();}
function tryRows(){let rows=+$('rows').value,str=decode('AAAATCTWTKDN',rows);$('trialGrid').innerHTML=grid(str,rows,12/rows,-1,12/rows,rows>6);$('trialText').textContent=str;}
function clock(){ $('clock').textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');}function stop(){clearInterval(timer);timer=null;$('start').textContent='시작';}function resetTimer(){stop();remaining=Math.max(1,Math.min(120,Number($('minutes').value)||10))*60;clock();}function toggleTimer(){if(timer){stop();return;}if(remaining<=0)resetTimer();$('start').textContent='일시정지';timer=setInterval(()=>{remaining--;clock();if(remaining<=0){stop();$('clock').textContent='시간 종료';}},1000);}
function menu(){let el=$('menu');el.hidden=!el.hidden;if(!el.hidden){el.innerHTML='<h2>수업 목차</h2><button onclick="menu()">닫기</button>'+slides.map((s,i)=>'<button onclick="jump('+i+')">'+(i+1)+'. '+s.title+'</button>').join('');}}function jump(i){idx=i;$('menu').hidden=true;render();}
async function full(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(e){$('toast').textContent='브라우저에서 F11을 눌러 전체화면을 사용하세요.';$('toast').hidden=false;setTimeout(()=>$('toast').hidden=true,4000);}}
$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('reveal').onclick=reveal;$('notes').onclick=()=>$('note').hidden=!$('note').hidden;$('contents').onclick=menu;$('full').onclick=full;$('start').onclick=toggleTimer;$('resetTimer').onclick=resetTimer;$('minutes').onchange=resetTimer;
addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA','BUTTON'].includes(document.activeElement.tagName))return;if(e.key==='Escape'){$('menu').hidden=true;$('note').hidden=true;return;}if(!$('menu').hidden)return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();move(1);}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();move(-1);}if(e.key.toLowerCase()==='a')reveal();if(e.key.toLowerCase()==='f')full();if(e.key==='Home'){idx=0;render();}if(e.key==='End'){idx=slides.length-1;render();}});
let startIndex=Number(location.hash.slice(1))-1;if(Number.isInteger(startIndex)&&startIndex>=0&&startIndex<slides.length)idx=startIndex;render();
</script></body></html>
